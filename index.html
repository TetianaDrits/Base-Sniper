<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Base Sniper</title>
<style>
  body { background: #0052FF; color: #fff; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
  #game { position: relative; width: 600px; height: 400px; background: #0b111e; margin: 20px auto; border: 3px solid #fff; border-radius: 12px; cursor: crosshair; }
  .target { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
</style>
</head>
<body>
<h1>Base Sniper</h1>
<p>Кликай по быстрым транзакциям Base! Избегай Высокого Газа (красные)!</p>
<h2>Очки: <span id="score">0</span></h2>
<div id="game"></div>
<script>
  let score = 0;
  const game = document.getElementById('game');
  function spawn() {
    const t = document.createElement('div');
    const isBad = Math.random() < 0.3;
    t.className = 'target';
    t.style.width = t.style.height = '40px';
    t.style.background = isBad ? '#ff4444' : '#00D395';
    t.innerText = isBad ? 'HIGH GAS' : 'BASE';
    t.style.left = Math.random() * 560 + 'px';
    t.style.top = Math.random() * 360 + 'px';
    t.onclick = (e) => {
      e.stopPropagation();
      if(isBad) { score = Math.max(0, score - 50); } else { score += 100; }
      document.getElementById('score').innerText = score;
      t.remove();
    };
    game.appendChild(t);
    setTimeout(() => { if(t.parentNode) t.remove(); }, 1200);
  }
  setInterval(spawn, 600);
</script>
</body>
</html>
